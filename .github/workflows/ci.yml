name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tai:
    name: tai · ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        exclude:      # GitHub's newest Ubuntu has no Python 3.9 builds
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install pytest pexpect .
      - name: Installed command works
        run: tai --version
      - name: Tests
        run: python -m pytest tests -v -p no:cacheprovider

  extension:
    name: VS Code extension · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHON: python
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Chat interface (headless Chrome)
        run: npm run test:webview
      - name: Inside VS Code (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
      - name: Inside VS Code
        if: runner.os != 'Linux'
        run: npm run test:vscode

  package:
    name: Build downloads
    needs: [tai, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python package
        run: |
          python -m pip install build
          python -m build --outdir out
      - name: VS Code extension
        working-directory: vscode
        run: |
          npm ci
          npm run package
          mv *.vsix ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: tai-downloads
          path: out/*
      - name: Attach to the release (tags like v1.3.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
